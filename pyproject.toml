[tool.poetry]
package-mode = false

[project]
name = "chrosttbot"
version = "0.1.0"
description = "Bot Telegram multiguna: hapus background, cek saham, berita IDX, dan downloader media."
authors = [
    {name = "RusdiEneri",email = "nuruddinrusydiilham@gmail.com"},
    {name = "rkyarc",email = "rkyarc@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytelegrambotapi (>=4.36.0,<5.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "yfinance (>=1.5.2,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "feedparser (>=6.0.14,<7.0.0)",
    "cloudscraper (>=1.2.71,<2.0.0)",
    "beautifulsoup4 (>=4.13.0,<5.0.0)",
    "ddgs (>=9.16.1,<10.0.0)",
    "yt-dlp",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "watchfiles (>=1.2.0,<2.0.0)"
]
