[tool.poetry]
package-mode = false

[project]
name = "chrosttbot"
version = "0.1.0"
description = "Bot Telegram multiguna: hapus background, cek saham, berita IDX, dan downloader media."
authors = [
    {name = "RusdiEneri",email = "nuruddinrusydiilham@gmail.com"},
    {name = "rkyarc",email = "rkyarc@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytelegrambotapi (>=4.36.0,<5.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "yfinance (>=1.5.2,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "feedparser (>=6.0.14,<7.0.0)",
    "cloudscraper (>=1.2.71,<2.0.0)",
    "beautifulsoup4 (>=4.13.0,<5.0.0)",
    "ddgs (>=9.16.1,<10.0.0)",
    "yt-dlp",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "watchfiles (>=1.2.0,<2.0.0)"
]


# ========================
# RUFF
# ========================
# Aturan dipilih yang menangkap bug nyata, bukan gaya: F (nama/import tak
# terpakai, f-string salah), E4/E7/E9 (import & sintaks), B (jebakan umum),
# SIM (logika berbelit), PIE, RUF100 (noqa basi).
# BLE001 sengaja diabaikan: handler di proyek ini memang menangkap Exception
# luas supaya bot tidak mati karena satu kegagalan fitur.
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["bot", "tests"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B", "SIM", "PIE", "RUF100"]
ignore = [
    "B008",    # panggilan fungsi di nilai default — pola telebot handler
    "B904",    # raise ... from — pesan error sudah dipetakan manual
    "B905",    # zip(strict=) — tidak perlu di kode ini
    "SIM108",  # if-else vs ternary: eksplisit lebih mudah dibaca
]

[tool.ruff.lint.per-file-ignores]
# Test memakai argumen stub yang memang tidak dipakai dan helper panjang.
"tests/**" = ["B011", "SIM117", "SIM105", "ARG001", "ARG002"]

